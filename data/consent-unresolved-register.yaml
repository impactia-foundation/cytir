# Consent-UNRESOLVED register - ADR-024 amendment 3
# (RATIFIED by Tim 2026-08-19, PR #61; option (c), the sub-class split, in force).
#
# DISTINCT FROM data/consent-unclear-register.yaml. Do not conflate them:
#   * consent-unclear-register.yaml = consent RESOLVED. The host blocks only
#     vendor-specific AI-TRAINING tokens; we read its policy and it was
#     permissive for search (ADR-024 amendment 1).
#   * THIS register = consent UNRESOLVED. robots.txt is readable and permissive,
#     but /.well-known/tdmrep.json returns no readable policy answer (persistent
#     5xx on an absent well-known path), so the TDM leg can never resolve. A 404
#     would resolve cleanly as "no reservation"; a permanent 500 is a livelock.
#     Amendment 3 treats a definitively-unreadable endpoint as ABSENT after
#     rechecks with proven-live egress, admitting SEARCH ONLY, train_ok=false.
#
# MANDATORY GUARDRAIL (ratified): every host here carries a sealed witness with
# the per-attempt HTTP status for BOTH probes AND the egress-liveness proof for
# that attempt, so "unreadable" can never be recorded from an outage on our side.
#
# Explicit refusals are NEVER overridden. A readable tdm-reservation=1, a
# wildcard disallow, noai, or any explicit opt-out still declines, unchanged.
# If a host's tdmrep later becomes readable, the LIVE evidence wins and the host
# leaves this register - the resolver re-derives this on every resolve.
#
# Admission is host-scoped and revocable: remove the host to revoke, and record
# the purge in log.md (same discipline as the unclear register).
#
# declined_residue = sub-class (b): hosts that do not answer our policy probes at
# all. NOT admitted and NOT retryable - recorded so the decision is auditable and
# is not silently re-litigated by a later wave.
