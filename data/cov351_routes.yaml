# Task 351 — coverage-pack routes (PRs #47/#48 ratified packs).
# Config-is-data (doctrine 2): every source's route, filters, politeness,
# trust (ratified tiers), license and consent basis live HERE, not in code.
# Evidence per route: the task 351 recon notes (verified 2026-07-28).
#
# P3 regdocs is split into three sub-packs (disjoint hosts) so three fetch
# processes can run in parallel (Docling on big PDFs serializes a process;
# separate out-dirs/L0 waves avoid shard collisions). ALL THREE stage into
# ONE collection: aw_dregdocs_cov (stage_pack_b1 --resume).
#
# Trust stamps per specs/ch-industry-coverage.md P3 (A/0.95-1.0 CH
# regulators) + social-contract P5 (ENISA-class 0.9). cheminfo.ch SKIPPED
# (recon p3a: BAG awareness-campaign portal, not a regulator doc corpus).
# BLV SLMB: retired from blv.admin.ch (recon p3a) — recorded, not fetchable.
