  # ---- P1 social-contract IGO core, wave 1: VERIFIED routes only ----------
  # (recon task 351 recon igo_routes.yaml, 2026-07-28)
  # DEFERRED honestly (blocked routes, never spoofed): unesdoc (Cloudflare JS
  # challenge, no OAI), ohchr bulk (CF 403), iea (fully bot-blocked), ilo
  # research repository (OAI unauthorized, SPA), itu bulk (REST auth-gated ->
  # cards later), wipo (CC BY 4.0 default ratified route but TIND OAI list
  # verbs 500 server-side — retry later), oecd.ai national-policies DB (API
  # not curl-locatable — needs one headless capture first).
  igo:
    collection: aw_digo_cov
    theme: [social-contract]
    sources:
      iris_meta:
        host: iris.who.int
        mode: oai
        endpoint: https://iris.who.int/server/oai/request
        metadata_prefix: oai_dc
        sets: [com_10665_8]        # Headquarters publications (195,030)
        record_kind: meta          # minimal-record posture (Tim, PR #47):
                                   # title+abstract embedded, URL surfaced,
                                   # NO content fetched, NO full-text mirror
        identifier_re: 'iris\.who\.int'
        pdf_from: none
        max_records: 0
        delay: 2.0
        cap: 200000                # metadata harvest is cheap; SELECTION to
                                   # the ~50k budget happens post-harvest on
                                   # subject/doc_type (documented in task doc)
        lang_default: en
        source_type: official
        tier: A
        trust: 0.95
        license: who-rights-reserved-minimal-record
        license_version: "per-record dc:rights honored where present (CC BY-NC-SA 3.0 IGO on newer pubs)"
        attribution: "World Health Organization (IRIS)"
        consent: {basis: robots-live-resolve}
      who_factsheets:
        host: www.who.int
        mode: listing
        seeds: ["https://www.who.int/news-room/fact-sheets"]
        doc_re: 'href="(/news-room/fact-sheets/detail/[^"#?]+)"'
        delay: 2.0
        cap: 320
        lang_default: en
        source_type: official
        tier: A
        trust: 0.95
        license: who-rights-reserved-minimal-record
        attribution: "World Health Organization"
        consent: {basis: robots-live-resolve}
      normlex:
        host: normlex.ilo.org
        mode: urllist
        keep_query: true
        code_patterns:
          - template: "https://normlex.ilo.org/dyn/nrmlx_en/f?p=NORMLEXPUB:12100:0::NO::P12100_ILO_CODE:{code}"
            codes: ["C001-C190", "R001-R206", "P029", "P081", "P089", "P110", "P147", "P155"]
            lang: en
          - template: "https://normlex.ilo.org/dyn/nrmlx_fr/f?p=NORMLEXPUB:12100:0::NO::P12100_ILO_CODE:{code}"
            codes: ["C001-C190", "R001-R206", "P029", "P081", "P089", "P110", "P147", "P155"]
            lang: fr
        delay: 3.0                 # APEX app — extra gentle; httpx client
                                   # cookie persistence handles the APEX
                                   # session redirect (curl-L alone loops)
        cap: 850
        lang_default: en
        source_type: official
        tier: A
        trust: 0.95
        license: ilo-normative-text
        license_version: "official normative texts; no explicit license statement (recon igo_routes)"
        attribution: "International Labour Organization (NORMLEX)"
        consent: {basis: robots-live-resolve}
      oecdai_posts:
        host: oecd.ai
        mode: listing
        ok_hosts: ["oecd.ai", "www.oecd.ai"]
        seeds: ["https://wp.oecd.ai/wp-json/wp/v2/posts?per_page=100&page={n}"]
        n_start: 1
        n_max: 40
        doc_re: '"link":\s*"(https:\\?/\\?/(?:www\.)?oecd\.ai\\?/[^"]+)"'
        exclude: '/fr/'            # robots disallows /fr/* on oecd.ai
        delay: 2.0
        cap: 1600
        lang_default: en
        source_type: official
        tier: A
        trust: 0.9
        license: oecd-terms
        license_version: "OECD.AI observatory content; site terms not individually verified — minimal records only, flag for follow-up"
        attribution: "OECD.AI Policy Observatory"
        consent: {basis: robots-live-resolve}
  # ---- P1 ch-industry intl technical guidance, wave 1: VERIFIED routes ----
  # (recon task 351 recon intl_standards.yaml, 2026-07-28)
  # BLOCKED honestly (never crawled around): echa (403-edge from the orchestrator box AND
