# Consent-unclear register — ADR-024 amendment (Tim, 2026-07-13).
#
# Hosts whose robots blocks ONLY vendor-specific AI-TRAINING tokens (e.g.
# google-extended, gptbot) with NO wildcard/general AI block, NO Claude-family
# block (claudebot / claude-web / anthropic-ai), NO tdm-reservation / noai, and
# no explicit search signal either way. Per the amendment these hosts are
# INCLUDED FOR SEARCH (retrieval embedding + <=25-word snippet stored,
# train_ok=false stamped in every payload row) and TRACKED here — auditable,
# revisitable, purgeable by host if an owner ever objects.
#
# A wildcard AI block, any Claude-family token block, tdm-reservation, noai,
# or any explicit opt-out still = decline (unchanged).
#
# Maintained BY THE GATE: consent_gate.py appends qualifying hosts here
# automatically (never silently — it prints each append), and the ingest task
# syncs new entries back to this repo copy. Do not hand-edit entries except to
# purge a host on owner objection (record the purge in log.md).
