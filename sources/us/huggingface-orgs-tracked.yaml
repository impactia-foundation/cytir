# Hugging Face model cards for curated, AW-relevant orgs -- task 661 F5
# (industry-site refresh: "HF org model cards of tracked orgs"). See
# sources/us/github-releases-tracked.yaml's header for the shared
# `country: US` / STATUS reasoning; both packs are proposed together in
# ONE POLICY PR.
#
# STATUS: ingested. First live refresh landed in the promotion queue
# 2026-09-28 (a private pipeline module, task 661 F5
# follow-up) -- consent live-resolved for huggingface.co (search_ok=true,
# train_ok=true, no opt-out signal), 567 rows staged/packed/queued
# (pack refresh-direct-hf-models-20260928). Runs DAILY (11:30 UTC, task 693;
# was weekly) via aw-refresh-lane-direct-compose.timer. Task 693 widened the
# tracked list from 4 to 30 orgs (the major open-weight publishers plus the
# task 120 major-org list) after zai-org/GLM-5.3 was found missing.
id: us-huggingface-orgs-tracked
name: "Hugging Face model cards — curated org list (Hub API, no auth)"
country: US
layer: tech-docs
policy_section: "§4.4"
adapter: api
acquisition_policy: aw-acquisition-v1
outlink_policy: capture-and-receipt
preservation_profiles: [structured_data_feed, software_docs]
provenance: authored
trust_tier: 0.85
freshness: weekly

license:
  default: unknown-per-model
  notes: >
    Model cards carry per-model licences (often permissive, sometimes
    gated/restricted) -- read per model at admission time, never
    inferred from the org. Same ADR-111/ADR-112 minimum-record basis as
    the GitHub sibling pack: served/distributed on opt-out + minimum
    record unless the specific host's live-resolved signals opt out.

consent:
  basis: live-resolve-open
  train_ok_override: null
  notes: >
    Resolved live 2026-09-28 (a private pipeline module, from
    the crawl host): huggingface.co search_ok=true, train_ok=true, "no opt-out
    signal found". Re-resolved live again on every fetch
    (consent_gate.py --direct-crawl --search-indexing), never cached
    past this note.

status: ingested

# Fanned out one route per tracked org (schema: routes[] is for a pack
# that fans out over many same-shape hosts/items -- task 434). Each
# route's own `acquire` uses `documented_source_api` with a fixed
# `endpoint` (the Hub API base) and the per-org `author` filter carried
# in `query` -- `allowed: {endpoint, dialect, paginate, query, headers}`
# has no room for a flat list of orgs at pack level, which is what broke
# PR #383's schema check (task 661), fixed here.
# `a private pipeline module`'s `discover()` reads this pack's
# `routes[].acquire.params.query.author` via `pack_path` in the
# refresh-cadence row -- see that module's own doc comment. Expand the
# tracked list by adding a route entry, by PR, never by hand-editing
# prod -- this pack is the source of truth for what gets tracked.
