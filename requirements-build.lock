# The preflight audit flagged extraction libs as unpinned ("trafilatura/
# compound_split/langdetect unpinned") — a determinism risk: the same source
# HTML can extract to different markdown/dates across re-runs if
# trafilatura/htmldate/docling silently pick up a minor-version behavior
# change between the staging build and a later refresh/rebuild.
#
# Captured 2026-07-23 via `pip freeze` (read-only) against the GPU build box
# build venv (Python 3.10.12) — the venv with the FULL extraction
# stack (trafilatura, docling*, compound-split, htmldate, lxml, bs4). This is
# the versions actually in use for the aw_b1 staging build as of this audit;
# pin these for any re-run/refresh that must reproduce the same extraction
# behavior. Not a full `pip install -r` lock (see caveat below) — the
# extraction-critical subset, one version per package, as captured.
#
# CAVEAT (worth fixing before it bites): the lang-gate venv (the venv
# `sitemap_ingest.py` fetch/consent stages actually run under, per
# task 287's run_cov287.sh's $LANGVENV) carries charset-normalizer==3.4.9,
# NOT the 3.4.7 pinned below from the build venv. Two venvs, two patch
# versions of the same dependency, both live on the build path — pin BOTH to
# the same version before the next build run (whichever pins the extraction
# and fetch stage source-of-truth) to remove that determinism gap.

