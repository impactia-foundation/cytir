[pytest]
python_files = test_*.py
testpaths = tests pipeline
markers =
    live_port_probe: the test proves the live-Qdrant-port guard (root conftest.py) refuses a connect
    qdrant: the module uses the session's throwaway Qdrant; run it serially, never in parallel workers (tests/conftest.py)
    guard: a public-cut guard module; `cyt ops guards` runs all of them before a push (task 2390)
