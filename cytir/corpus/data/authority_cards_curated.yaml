# Curated authority cards (task 2659) -- the REGISTER for authorities (ADR-033/041: the curated tiered
# allowlist is our register; discovery-built cards are the fallback). Merged by
# `cyt ops source-cards merge`; a curated card WINS a host collision (source: curated); a discovery
# card's consent-declined disposition is kept (stricter wins). Tier comes from data/allowlist.yaml where
# the host is listed there (a test pins it); otherwise it is declared here. A=1.0 official register /
# primary legal source, B=0.82, C=0.72 (cytir.core.common.TIER_TRUST). Disposition is NEVER written here: it is derived at merge time
# from the consent registry (data/consent_declined_hosts.json) -> `consent-declined`, else `card`
# (the floor; no index claim). Carded for navigation; fetchability is not membership (admin.ch, legifrance.gouv.fr, eur-lex.europa.eu and
# bundesverwaltungsgericht.ch were unreadable from the probe host on 2026-11-10 and are carded anyway).
#
# NOT CARDED (stand-ins): m3.ti.ch (403; ti.ch stands in), prestations.vd.ch (login redirect and a
#   registry decline; vd.ch stands in). A WAF 403/202 or a TLS miss from one vantage is `unreadable`, never
#   `declined`: it does not remove a card (a card names a source for navigation; it never fetches).
# bger.ch: the probe host lacks the issuer cert (curl rc 60); answers 200 with -k; kept.
cards:
